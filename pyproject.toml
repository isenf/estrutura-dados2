[project]
name = "estrutura-dados-2"
version = "0.1.0"
description = "Data structure coursework"
readme = "README.md"
authors = [
    { name = "Fabro", email = "mfabro@alunos.utfpr.edu.br" }
]
requires-python = ">=3.14"
dependencies = [
    "cairocffi>=1.7.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.7",
    "python-igraph>=1.0.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true
